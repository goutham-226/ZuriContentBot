services:
  db:
    image: postgres:16-alpine
    container_name: creatorfriendly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator_dev_password
      POSTGRES_DB: creatorfriendly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start of an empty volume
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creatorfriendly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
